[ParallelDraw]
; 1 = on, 0 = off (the DLL does nothing)
Enabled=1
; worker threads besides the game thread; 0 = number of CPU cores - 1, at most 7
Threads=0
; 1 = draw packets of the models built on several cores, 0 = off (2 = stand check, not for play)
Mode=1
; 1 = a line every 10 s in ParallelDraw.log (statistics)
Stats=0
