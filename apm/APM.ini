[APM]
; 1 = on, 0 = off (0 at game start: the DLL stays idle until the next start)
Enabled=1
; Changes below are picked up while the game runs, within a second: edit, save, look.
;
; where the number is:
;   right = beside the block of the stars and the match clock at the top centre, right of it (under the enemy score)
;   left  = the same, left of it (under your score)
; A match without the victory point counter (annihilation): under the Menu button, right of the match clock.
; (the launcher's "Place" pick writes this key)
Place=right
; actions in the last this many seconds of game time, per minute; 0 = the average over the whole match
Window=60
; the text before the number
Label=APM
; size in the movie's own units (the "Menu" label is 20), colour RRGGBB, a soft dark shadow (1/0)
FontSize=18
Color=FFFFFF
Shadow=1
; move it by this (the movie's units); Gap: further from (+) or nearer to (-) the edge
;OffsetX=0
;OffsetY=0
;Gap=0
; 0 = in every game (multiplayer, offline vs AI); 1 = only in live multiplayer matches
OnlineOnly=0
