[APM]
; 1 = on, 0 = off (0 at game start: the DLL stays idle until the next start)
Enabled=1
; Changes below are picked up while the game runs, within a second: edit, save, look.
;
; where the number is:
;   top     = at the top centre, on the match clock's line right of it (default; left = left of it)
;   minimap = above the minimap at the bottom left (right of the match clock when that is there too)
; A match without the victory point counter (annihilation): above the minimap (Fallback=0: nowhere)
; (the launcher's "Place" pick writes this key)
Place=top
Fallback=1
; actions in the last this many seconds of game time, per minute; 0 = the average over the whole match
Window=60
; the text before the number
Label=apm
; size in the movie's own units (the "Menu" label is 20): empty = 18 at the top, 24 at the minimap; LabelSize the same (13 / 17)
;FontSize=24
;LabelSize=17
; colour RRGGBB, a soft dark shadow (1/0)
Color=FFFFFF
Shadow=1
; move it by this (the movie's units); Gap: further from (+) or nearer to (-) the edge
;OffsetX=0
;OffsetY=0
;Gap=0
; 0 = in every game (multiplayer, offline vs AI); 1 = only in live multiplayer matches
OnlineOnly=0
