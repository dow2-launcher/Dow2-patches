[ParallelPose]
; 1 = on, 0 = off (the DLL does nothing)
Enabled=1
; worker threads besides the game thread; 0 = number of CPU cores - 1, at most 7
Threads=0
; 1 = model poses built on several cores, 0 = off (2 = stand comparison, not for play)
Mode=1
; 1 = a line every 10 s in ParallelPose.log (statistics)
Stats=0
; ms the game thread waits for the workers before it writes a STALL line to the log (0 = never)
Watchdog=100
; a wait this long (ms) switches the workers off for the rest of the game session (0 = never)
StallOff=2000
