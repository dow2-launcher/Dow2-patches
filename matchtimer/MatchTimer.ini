[MatchTimer]
; 1 = on, 0 = off (0 at game start: the DLL stays idle until the next start)
Enabled=1
; Changes below are picked up while the game runs, within a second: edit, save, look.
;
; where the clock is:
;   top   = under the victory point counter at the top centre (default). A match without the counter (annihilation)
;           puts it under the Menu button (TopFallback=0: nowhere), the next match tries the top again
;   under = on a plate under the Menu button (top right)
;   menu  = in the Menu button itself: "Menu (12:34)"
;   minimap = above the minimap at the bottom left
; (the launcher's "Place" pick writes this key)
Place=top
; size of the digits in the movie's own units (the "Menu" label is 20); default 18 (menu: 17)
FontSize=18
; colour RRGGBB; default FFFFFF at the top, CAF9FF (the colour of the "Menu" label) under / in the Menu button
;Color=FFFFFF
; 1 = a soft dark shadow under the digits, 0 = none
Shadow=1
; any place: move the clock by this (the movie's units; top default -7 / 6)
;OffsetX=0
;OffsetY=0
; under: the plate (1 = a copy of the Menu button's background, 0 = none), its size, how far up the Menu button goes
;Plate=1
;Width=100
;Height=34
;Raise=8
;TextY=-1
; 0 = in every game: multiplayer, offline vs AI and replays; 1 = only in live multiplayer matches
OnlineOnly=0
