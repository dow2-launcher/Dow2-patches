[MatchTimer]
; 1 = on, 0 = off (0 at game start: the DLL stays idle until the next start)
Enabled=1
; The clock is text of the game's own Menu button (under it, in the game's font). Changes below are picked up while the
; game runs, within a second: edit, save, look.
; size of the digits in the button's own units (the "Menu" label is 20)
FontSize=22
; colour RRGGBB (CAF9FF = the colour of the "Menu" label)
Color=CAF9FF
; 1 = a soft dark shadow under the digits, 0 = none
Shadow=1
; 0 = in every game: multiplayer, offline vs AI and replays; 1 = only in live multiplayer matches
OnlineOnly=0
