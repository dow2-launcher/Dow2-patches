[LobbyStats]
; 1 = Relic rating and stats in the lobby (names and hover tooltips), 0 = off
Stats=1
; 1 = rating after the name in the lobby, 0 = only in the hover tooltip
ShowRatingInName=1
; which rating: relic = Relic's (one number for every mode, as before), own (or elite) = our Elite rating of the lobby's mode
; (1v1 / 2v2 / 3v3; "cal 2/5" while calibrating, a dash without one; the tooltip shows every mode and the Steam hours), and no
; rating on the main menu. Default relic. ONE switch for two add-ons: LoadingRatings.dll (the loading screen) reads this key from
; this file too (the LobbyStats.ini next to it), so the launcher writes only here - Elite_DLLs\LobbyStats.ini, and
; dow2-patches\LobbyStats.ini for the vanilla copies
;Rating=relic
; stats service host (no https://, no path), or several separated by ";" - the next is tried when one can't be reached.
; Empty = the one baked in at build time with its mirrors (rts.fintebtc.de;dow2.fintebtc.de;dow2ru.fintebtc.de)
;Server=

[Debug]
; 1 = write LobbyStats_invoke.log: every Flash function the game calls (lobby, loading screen, HUD) with its
; arguments, and once a minute how often each one was called. For finding UI functions; leave 0 otherwise.
LogInvoke=0

[MenuTooltip]
; the stats tooltip over your rating in the main menu covers the game's own one ("Currently logged in player");
; in 1/1000 of the screen height: its right edge and top relative to the cursor, and its least width
DX=3
DY=4
MinWidth=300

[MatchTimer]
; match clock (MM:SS of game time) above the minimap, in the game font; 1 = on, 0 = off. The look: see matchtimer/MatchTimer.ini
Enabled=1

[LoadingScreen]
; 1 = a box with everyone's Relic rating on the loading screen of an online match (the players of the last lobby, by team)
Ratings=1

[Lobby]
; a sound (the game own UI alert) and a flashing taskbar button when someone comes into the lobby:
; 1 = only while the game is in the background, 2 = always, 0 = off
;JoinSound=1   (set by the launcher option)
; your own .wav instead (a full path, or a file name next to LobbyStats.dll); empty = the game alert
;SoundFile=

[Cooldowns]
; seconds left on recharging abilities and global abilities in the middle of the button: 1 = on, 0 = off (the default)
;Enabled=0   (set by the launcher option)
; height of the digits in px at 1440 lines (scaled by the screen height), and their colour (RRGGBB)
;Size=29
;Color=FFF8F0
