[JoinSound]
; A sound when someone comes into the lobby. The launcher's tick "Sound when someone joins the lobby" is the switch.
; Sound=soft  - a short quiet chime (default)
; Sound=sharp - the game's own alert sound
Sound=soft
; When=background - only while the game is not the active window (default); When=always - also in front
When=background
; SoundFile=my.wav - your own .wav (next to this file or a full path) instead
