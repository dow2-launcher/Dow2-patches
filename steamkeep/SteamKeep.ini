[SteamKeep]
; 1 = on, 0 = off
Enabled=1
; keep online games (custom / automatch) going when Steam goes away
Online=1
; keep offline games (skirmish vs AI, campaign) going too
Offline=1
; 1 = once Steam went away in a match, its request to close the game is ignored until the match is over
; (your own Alt+F4, the window's close button and Quit in the game menu always work)
IgnoreSteamClose=1
