[SteamKeep]
; 1 = on, 0 = off
Enabled=1
; keep online games (custom / automatch) going when Steam goes away
Online=1
; keep offline games (skirmish vs AI, campaign) going too
Offline=1
; a close request of the game window within this many seconds after Steam went away is ignored (0 = not touched)
CloseWindowSec=30
