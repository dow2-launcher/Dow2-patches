[UIScale]
; 1 = on, 0 = off
Enabled=1
; size of the in-match interface (minimap, unit panel, abilities, resources, hero portraits, objectives, menu button):
; auto = by the game's vertical resolution (1080 -> 100 %, 1440 -> 133 %, 2160 -> 200 %) times the game's own UI scale
;        (configuration.lua "uiscale" = the launcher's Settings > UI scale slider; its 100 % = just auto, 150 % at 4K = 300 %),
; or a percent of the interface's own pixel size, 50 ... 400 (then configuration.lua is not looked at)
Scale=auto
