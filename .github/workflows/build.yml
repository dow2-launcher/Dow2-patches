name: build
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.version.outputs.number }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          python3 scripts/release_notes.py check "$version"
          {
            echo "number=$version"
            echo "tag=v$version"
            case "$version" in *.0) echo "release=true" ;; *) echo "release=false" ;; esac
          } >> "$GITHUB_OUTPUT"
          echo "Version **$version**" >> "$GITHUB_STEP_SUMMARY"

  dlls:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-mingw-i686-win32-${{ runner.os }}-noble
      - name: MinGW
        run: |
          # the runners' Ubuntu mirror is often very slow (~50 KB/s), so the .deb files are cached between runs
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" gcc-mingw-w64-i686-win32
          sudo chown -R "$USER" ~/apt-archives
          i686-w64-mingw32-gcc --version | head -1
      - run: make
      - run: cd build && sha256sum ./*.dll | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dow2-fixes-dlls
          path: build/*
          retention-days: 7

  # Everything a real upload of the add-ons to the launcher mirrors does, against a temporary store and a one-off key.
  # The upload itself is skipped until the mirrors and the real signing key are available to CI.
  publish:
    needs: [version, dlls]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.number }}
    steps:
      - name: Paths
        run: |
          {
            echo "KEYS=$RUNNER_TEMP/keys"
            echo "DIST=$RUNNER_TEMP/dist"
            echo "STORE=$RUNNER_TEMP/store"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: dow2-launcher/Dow2-elite-launcher
          path: launcher
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - uses: actions/download-artifact@v4
        with:
          name: dow2-fixes-dlls
          path: ${{ runner.temp }}/dist
      - name: One-off signing key
        working-directory: launcher
        run: |
          cargo build -q -p elite-publish
          ./target/debug/elite-publish keygen "$KEYS"
          # the public key is compiled in: rebuild so that `verify` checks against the one-off key
          cp "$KEYS/public.key" keys/public.key
          cargo build -q -p elite-publish
      - name: Publish into a temporary store
        working-directory: launcher
        run: |
          ./target/debug/elite-publish version "$DIST" "$STORE" "dow2-patches-$VERSION" "$KEYS/private.key"
          printf '{"schema":1,"components":[{"id":"dow2-patches","version":"dow2-patches-%s"}]}\n' "$VERSION" > "$STORE/launcher.json"
          ./target/debug/elite-publish sign "$STORE/launcher.json" "$KEYS/private.key"
          ./target/debug/elite-publish verify "$STORE"
      - name: Summary
        run: |
          {
            echo "### dow2-patches $VERSION: dry-run publish"
            echo '```'
            (cd "$DIST" && find . -type f -printf '%s\t%P\n' | awk -F'\t' '{printf "%8.1f KB  %s\n", $1/1e3, $2}')
            echo '```'
            echo "Store: $(find "$STORE/blobs" -type f | wc -l) blobs, $(du -sh "$STORE" | cut -f1); signatures OK."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to the mirrors
        run: |
          echo "::notice::Upload to the mirrors skipped: no server access and no real signing key in CI yet"
          echo "Upload to the mirrors: **skipped** (no server access yet)" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up
        if: always()
        run: rm -rf "$KEYS" "$DIST" "$STORE" launcher

  # On a push to main: a DRAFT GitHub Release vX.Y.Z with the DLLs, SHA256SUMS.txt and addons.json. A draft carries
  # no tag and is invisible to players, so nothing reaches them from here; it is published by hand after the files are
  # on the mirrors, and GitHub creates the tag then. If vX.Y.Z is already published, the build only warns to raise the
  # version. No delivery is done here.
  draft:
    needs: [version, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dow2-fixes-dlls
          path: dist
      - name: Assemble the draft
        run: |
          cp addons.json dist/
          python3 scripts/release_notes.py section "$VERSION" > notes.md
          ls -la dist
      - name: Create or update the draft release
        run: |
          state="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo absent)"
          if [ "$state" = false ]; then
            echo "::warning::$TAG is already published - raise the version in VERSION to make a new draft"
            exit 0
          fi
          if [ "$state" = true ]; then
            gh release edit "$TAG" --draft --title "dow2-patches $VERSION" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --title "dow2-patches $VERSION" --notes-file notes.md
          fi
          echo "Draft **$TAG** ready ($(ls dist | wc -l) files)" >> "$GITHUB_STEP_SUMMARY"
