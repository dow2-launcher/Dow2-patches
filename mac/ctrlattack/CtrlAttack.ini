[CtrlAttack]
; 0 = off (the key + left click is the game's own again), re-read every 2 s
Enabled=1
; hold this key and LEFT-click the ground: the selected squads that can attack the ground fire at the point.
; Alt = Option (default). Ctrl does not work on the Mac: Feral turns Control + click into a right click. Or a Plat::Input key number.
Key=Alt
; 1 = log every key + left click
Verbose=0
