[LobbyStats]
; 1 = ratings in the lobby (after the names and in the slot tooltips) and after your name on the main menu, 0 = off
Enabled=1
; 1 = rating after the name, 0 = only in the hover tooltip
ShowRatingInName=1
; which rating: relic = Relic's (one number for every mode), own (or elite) = our Elite rating of the lobby's mode (1v1 / 2v2 /
; 3v3; "cal 2/5" while calibrating, a dash without one; the tooltip shows every mode and the Steam hours), and none on the main menu
Rating=relic
; the stats service: a host, or several separated by ";" - the next is tried when one can't be reached (no https://, no path).
; Empty = rts.fintebtc.de;dow2.fintebtc.de;dow2ru.fintebtc.de
;Server=
