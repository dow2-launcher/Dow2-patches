[UnitStats]
Enabled=1
; text size in the panel's own units (core_actions); icons 1.2x that unless IconSize is set
FontSize=22
IconSize=0
OffsetX=0
OffsetY=0
; "44 (3x14.6)": the squad total and, when all models are the same, the per-model number the unit tooltips quote
PerModel=1
; the engine calls behind the numbers (1 = on): the game's melee skill getter, entity modifiers (speed), level damage multiplier
GameSkill=1
EntityMods=1
LevelMul=1
Verbose=1
[Icons]
; any game texture, "img://data:UI/...dds|scale%" (only .dds; plain DATA: paths are not loaded by this GFx)
;Ranged=img://data:UI/textures/space_marines/icon_movement/stance_ranged.dds
;Melee=img://data:UI/textures/space_marines/icon_movement/stance_melee.dds
;Skill=img://data:UI/textures/generic/decorators/mod_melee.dds
;Range=img://data:UI/textures/generic/tooltips/ico_range.dds|130
;Speed=img://data:UI/textures/eldar/icon_traits/eld_swift.dds
;Sight=img://data:UI/textures/generic/fe/loading/tips/up_detector.dds|150
;ArmourInfantry=img://data:UI/textures/generic/tooltips/ico_l_infantry.dds|130
;ArmourHeavy=img://data:UI/textures/generic/tooltips/ico_h_infantry.dds|130
;ArmourVehicle=img://data:UI/textures/generic/tooltips/ico_vehicles.dds|130
;ArmourBuilding=img://data:UI/textures/generic/tooltips/ico_buildings.dds|130
