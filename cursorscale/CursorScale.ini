[CursorScale]
; 1 = on, 0 = off
Enabled=1
; cursor size: auto = by the vertical resolution of the game (1080 -> 1x, 1440 -> 1.33x, 2160 -> 2x),
; or a number from 1.0 (the game's own size) to 4.0 (the launcher offers 1.25, 1.5, 2, 2.5, 3)
Scale=auto
; smooth = soft edges (default), sharp = crisp pixels
Filter=smooth
