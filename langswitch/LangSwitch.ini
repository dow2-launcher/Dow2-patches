[LangSwitch]
; 1 = on, 0 = off
Enabled=1
; 1 = the messages of the game thread's other windows (the language switch of Windows' text services) are dispatched
Pump=1
; 1 = after Alt+Shift / Ctrl+Shift (as set in Windows) with no change of the layout, LangSwitch asks for the next one itself
Fallback=1
; how long Windows gets before that, ms
FallbackDelay=500
; 1 = log every Alt+Shift / Ctrl+Shift
Verbose=0
