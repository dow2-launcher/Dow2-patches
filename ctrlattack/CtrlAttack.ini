[CtrlAttack]
; 0 = off (the plain right-click again), re-read on every right-click with the key held
Enabled=1
; hold this key and right-click the ground: the selected squads that can attack the ground fire at the point (Ctrl, Alt or a virtual key code)
Key=Ctrl
; Reverse.dll on with the same key: vehicles keep backing off (1) or attack the ground too when they can (0)
VehiclesReverse=1
; 1 = log every right-click with the key held
Verbose=0
